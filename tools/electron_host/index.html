<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AT32 AHRS Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><div class="eyebrow">AT32F423 · LSM6DSV / IST8310</div><h1>AHRS Studio</h1><p>串口姿态监视与设备配置中心</p></div><div class="status"><i id="dot"></i><span id="link">未连接</span><b id="rate">--</b><small>帧/s</small></div></header>
<main><section class="toolbar card"><select id="port"><option value="">选择串口</option></select><button id="refresh">刷新端口</button><select id="baud"><option>2000000</option><option>115200</option><option>921600</option></select><button id="connect" class="primary">连接设备</button><button id="disconnect" disabled>断开</button><span id="notice">就绪</span></section>
<section class="metrics"><article><label>YAW</label><strong id="yaw">--</strong><em>°</em></article><article><label>PITCH</label><strong id="pitch">--</strong><em>°</em></article><article><label>ROLL</label><strong id="roll">--</strong><em>°</em></article><article><label>温度</label><strong id="temp">--</strong><em>°C</em></article><article><label>设备模式</label><strong id="mode">未知</strong><em id="flags">--</em></article></section>
<section class="layout"><div class="card hero"><div class="title"><h2>实时姿态</h2><span id="stream">JustFloat / 自动识别</span></div><canvas id="attitude" width="760" height="430"></canvas><div class="axis"><span>YAW <b id="yaw2">--</b></span><span>PITCH <b id="pitch2">--</b></span><span>ROLL <b id="roll2">--</b></span></div></div>
<div class="card panel"><div class="title"><h2>设备设置</h2><span id="settings" class="pill">未进入设置模式</span></div><p class="muted">配置命令使用 AA 55 二进制协议，修改模式后由 MCU ACK 确认。</p><div class="buttons"><button id="enter">进入设置模式</button><button id="exit" disabled>退出设置模式</button></div><fieldset id="modeGroup" disabled><legend>融合模式</legend><label><input type="radio" name="mode" value="0">六轴</label><label><input type="radio" name="mode" value="1" checked>九轴</label><label><input type="radio" name="mode" value="2">九轴相对角</label></fieldset><label class="check"><input id="restart" type="checkbox"> 保存后立即重启</label><button id="apply" class="primary wide" disabled>应用融合模式</button><div class="split"><input id="canId" value="1" placeholder="CAN ID，如 0x123"><button id="setCan">写入 CAN ID</button></div><div class="buttons"><button id="zero">Yaw 归零</button><button id="ping">PING</button><button id="query">查询状态</button></div><div class="buttons"><button id="gyro">陀螺仪校准</button><button id="acc">六面加速度校准</button></div></div></section>
<section class="card logbox"><div class="title"><h2>通信日志</h2><button id="clear">清空</button></div><pre id="log"></pre></section></main><footer>Electron 本地串口 · JustFloat 实时姿态 · 二进制命令/ACK</footer><script src="renderer.js"></script></body></html>
