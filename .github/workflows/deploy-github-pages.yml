name: Deploy gyroa upper to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'upper/gyroa/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-gyroa
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upper/gyroa/package-lock.json

      - name: Install dependencies
        working-directory: upper/gyroa
        run: npm ci --no-audit --no-fund

      - name: Build gyroa upper
        working-directory: upper/gyroa
        run: npm run build

      - name: Add nojekyll marker
        run: touch upper/gyroa/dist/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upper/gyroa/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
